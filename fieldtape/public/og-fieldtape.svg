<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">FieldTape for Kaggriculture</title>
  <desc id="desc">An editorial game board with two farms, a shared market line, and the words 720 moves, 30 days, one shared market.</desc>
  <defs>
    <pattern id="paper" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 12L12 0" stroke="#181713" stroke-opacity=".025"/>
    </pattern>
    <pattern id="soil" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 9H18M9 0V18" stroke="#ece6d6" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <clipPath id="chart"><rect x="442" y="391" width="664" height="108"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="#ece6d6"/>
