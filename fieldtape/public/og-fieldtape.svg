    <text x="58" y="198" font-size="82" font-weight="800" letter-spacing="-4">FieldTape</text>
    <text x="61" y="244" font-size="25" font-weight="500">for Kaggriculture</text>
    <text x="58" y="338" font-size="47" font-weight="700" letter-spacing="-1.5">720 moves.</text>
    <text x="58" y="390" font-size="47" font-weight="700" letter-spacing="-1.5">30 days.</text>
    <text x="58" y="442" font-size="47" font-weight="700" letter-spacing="-1.5">One shared market.</text>
    <text x="58" y="535" font-size="18" font-weight="700" letter-spacing="2">PLAY • WATCH • LEARN</text>
  </g>

